openapi: 3.0.3
info:
  title: AI Service
  version: 0.1.0
  description: Content generation and intelligence service contract.
paths:
  /generate:
    post:
      summary: Generate content draft based on trend context and agent niche
      operationId: generateContent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateRequest'
      responses:
        '200':
          description: Generated post draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateResponse'
        '400':
          description: Invalid request parameters
components:
  schemas:
    GenerateRequest:
      type: object
      required: [agent_job_id, niche, target_platform, trend_topics]
      properties:
        agent_job_id:
          type: string
        niche:
          type: string
        target_platform:
          type: string
          enum: [reddit, instagram, linkedin]
        tone:
          type: string
        trend_topics:
          type: array
          items:
            type: string
        product_description:
          type: string
        target_insights:
          type: string
    GenerateResponse:
      type: object
      required: [caption, suggested_hashtags]
      properties:
        caption:
          type: string
        suggested_hashtags:
          type: array
          items:
            type: string
        format_recommendation:
          type: string
